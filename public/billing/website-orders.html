<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shri Senthura Crackers Website Orders</title>
  <link rel="stylesheet" href="css/admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/website-orders.js" defer></script>
  <style>
    .primary {
      background: #0b2e55 !important;
      border-color: #0b2e55 !important;
      color: white !important;
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-wrap">
          <img src="../assets/ssLogo.png" alt="Shri Senthura Crackers logo" class="brand-mark" />
          <div><div class="brand-title">Shri Senthura Crackers</div><div class="brand-sub">Website Orders</div></div>
        </div>
        <button class="nav-toggle" type="button" aria-label="Toggle navigation">☰</button>
        <nav class="nav-links">
          <a class="nav-pill" href="billing.html">POS Billing</a>
          <a class="nav-pill" href="dashboard.html">Dashboard</a>
          <a class="nav-pill" href="products.html">Products</a>
          <a class="nav-pill" href="customers.html">Customers</a>
          <a class="nav-pill active" href="website-orders.html">Website Orders</a>
          <a class="nav-pill" href="feedback.html">Feedback</a>
          <a class="nav-pill" href="history.html">Order History</a>
          <a class="nav-pill" href="reports.html">Analytics</a>
          <a class="nav-pill" href="backup.html">Backup &amp; Restore</a>
          <button class="nav-pill secondary" id="logoutBtn" type="button">Logout</button>
        </nav>
      </div>
    </header>
    <main class="page-container">
      <div class="section-head"><div><h1 class="section-title">Website Order Requests</h1><div class="subtle">Confirm or cancel orders submitted from the customer website</div></div><button class="primary" id="refreshBtn" type="button">Refresh</button></div>
      <section class="panel"><div class="panel-header"><h2 class="panel-title">Waiting for confirmation</h2><span id="resultCount" class="subtle">0 requests</span></div><div id="ordersContainer" class="table-wrap"></div></section>
    </main>
  </div>
  <script>
    const navToggle = document.querySelector('.nav-toggle');
    const navLinks = document.querySelector('.nav-links');
    if (navToggle && navLinks) navToggle.addEventListener('click', () => navLinks.classList.toggle('nav-open'));
    if (window.frameElement || window.self !== window.top) {
      document.body.setAttribute('data-embedded', 'true');
      const topbar = document.querySelector('.topbar');
      if (topbar) topbar.style.display = 'none';
    }
  </script>
</body>
</html>
