<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shri Senthura Crackers - Client Orders</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="supabase-config.js"></script>

  <script>
    window.SRI_VELAVAN_WHATSAPP = "919940051105";
    window.SRI_VELAVAN_WHATSAPP_DISPLAY = "+91 99400 51105";
window.SRI_VELAVAN_LOGO_DATA = "ssLogo.png";
    document.addEventListener("DOMContentLoaded", function () {
      const invoice = document.getElementById("invoiceContainer");
      if (!invoice) return;

      function updateGeneratedInvoice() {
        if (!invoice.children.length) return;

        if (!invoice.querySelector(".srivel-pdf-logo")) {
          const img = document.createElement("img");
          img.className = "srivel-pdf-logo";
          img.src = window.SRI_VELAVAN_LOGO_DATA;
          img.alt = "Shri Senthura Crackers";
          img.style.cssText =
            "display:block;width:34mm;height:34mm;object-fit:contain;margin:0 auto 5mm auto;";
          invoice.insertBefore(img, invoice.firstChild);
        }

        const walker = document.createTreeWalker(invoice, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);

        nodes.forEach(function (node) {
          if (node.nodeValue && /99400\s*51105|919940051105/.test(node.nodeValue)) {
            node.nodeValue = node.nodeValue
              .replace(/\+?91[\s-]*99400[\s-]*51105/g, "+91 99400 51105")
              .replace(/99400[\s-]*51105/g, "+91 99400 51105");
          }
        });
      }

      new MutationObserver(updateGeneratedInvoice)
        .observe(invoice, { childList: true, subtree: true });

      updateGeneratedInvoice();
    });
  </script>
  <script src="js/client-order.js" defer></script>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --primary: #f97316;
      --primary-dark: #ea580c;
      --accent: #fff7ed;
      --success: #16a34a;
      --danger: #dc2626;
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); }
    body { padding: 24px; }

    .page-shell {
      max-width: 1280px;
      margin: 0 auto;
      background: rgba(255,255,255,0.68);
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark {
      width: 52px; height: 52px; object-fit: contain; border-radius: 16px; background: var(--accent);
      border: 1px solid rgba(249,115,22,0.15); padding: 6px;
    }
    .brand h1 { margin: 0; font-size: 28px; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(320px, 0.9fr);
      gap: 24px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 8px 16px rgba(15, 23, 42, 0.03);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .search-wrap { position: relative; min-width: 220px; flex: 1; }
    .search-wrap input {
      width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px 12px 42px; font-size: 15px;
      outline: none; background: #fff;
    }
    .search-wrap input:focus { border-color: rgba(249,115,22,0.55); box-shadow: 0 0 0 4px rgba(249,115,22,0.08); }
    .search-icon { position: absolute; left: 14px; top: 12px; }

    .select-wrap select {
      border: 1px solid var(--border); background: #fff; color: var(--text); padding: 12px 14px; border-radius: 12px;
      min-width: 210px; outline: none; font-size: 15px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }

    .product-card {
      border: 1px solid var(--border); background: linear-gradient(180deg, #ffffff 0%, #fffdfa 100%);
      border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; height: 100%;
      justify-content: space-between;
    }

    .product-image {
      width: 100%; height: 110px; object-fit: contain; border-radius: 12px; background: linear-gradient(135deg, #fff7ed, #f5f3ff);
      border: 1px solid rgba(249,115,22,0.08);
      padding: 8px;
    }

    .product-meta { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .product-name {
      font-weight: 700; font-size: 15px; min-height: 42px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .product-price { color: var(--primary-dark); font-weight: 800; font-size: 18px; }
    .product-original { color: var(--muted); text-decoration: line-through; font-size: 12px; }

    .add-btn {
      cursor: pointer; border: none; border-radius: 12px; background: var(--primary); color: white; padding: 10px 12px; font-weight: 700;
      transition: background 0.2s ease; font-size: 14px;
    }
    .add-btn:hover { background: var(--primary-dark); }
    .qty-badge {
      display: inline-flex; align-items: center; justify-content: center; padding: 3px 8px; background: rgba(249,115,22,0.12); color: var(--primary-dark);
      border-radius: 999px; font-size: 12px; font-weight: 700;
    }

    .cart-card { display: flex; flex-direction: column; gap: 14px; position: relative; }
    .cart-header { display: flex; align-items: center; justify-content: space-between; }
    .cart-header h2 { margin: 0; font-size: 22px; }
    .item-count { padding: 6px 10px; border-radius: 999px; background: #fff7ed; color: var(--primary-dark); font-size: 12px; font-weight: 700; }
    .cart-actions {
      position: sticky;
      top: 12px;
      z-index: 10;
      background: var(--card);
      padding-top: 4px;
    }

    .empty-cart {
      text-align: center; padding: 28px 18px; border: 1px dashed var(--border); border-radius: 14px; color: var(--muted); background: #fafafa;
    }

    .cart-list { display: flex; flex-direction: column; gap: 12px; }
    .cart-item {
      display: flex; flex-direction: column; gap: 10px; background: #fffaf7; border: 1px solid rgba(249,115,22,0.12); border-radius: 14px; padding: 12px;
    }

    .cart-top { display: flex; justify-content: space-between; gap: 12px; }
    .cart-name { font-weight: 700; }
    .remove-btn {
      background: transparent; border: none; color: var(--danger); font-weight: 700; cursor: pointer; padding: 0; font-size: 12px;
    }

    .qty-control {
      display: flex; align-items: center; gap: 8px; justify-content: space-between;
    }
    .qty-buttons {
      display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: white;
    }
    .qty-buttons button {
      border: none; background: transparent; width: 32px; height: 32px; cursor: pointer; font-size: 20px; color: var(--text);
    }
    .qty-buttons span { min-width: 28px; text-align: center; font-weight: 700; }
    .price-total { font-weight: 800; }

    .totals {
      display: flex; flex-direction: column; gap: 10px; padding-top: 12px; border-top: 1px solid var(--border);
      font-size: 15px;
    }
    .total-row { display: flex; justify-content: space-between; align-items: center; }
    .grand-total { font-size: 26px; font-weight: 900; color: var(--primary-dark); }

    .action-btn {
      border: none; border-radius: 14px; padding: 14px 18px; font-size: 16px; font-weight: 800; cursor: pointer; background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
      color: white; box-shadow: 0 12px 18px rgba(249,115,22,0.18); transition: transform 0.15s ease;
    }
    .action-btn:hover { transform: translateY(-1px); }
    .action-btn.secondary {
      background: #111827; box-shadow: 0 12px 18px rgba(17, 24, 39, 0.15);
    }

    .details-panel {
      margin-top: 18px; display: none;
    }
    .details-panel.active { display: block; }
    .state-warning,
    .cart-warning {
      display: none;
      margin-top: 8px;
      padding: 9px 12px;
      border-radius: 10px;
      background: rgba(220, 38, 38, 0.08);
      color: var(--danger);
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(220, 38, 38, 0.14);
    }
    .state-warning.show,
    .cart-warning.show { display: block; }
    .form-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px;
    }
    .field { display: flex; flex-direction: column; gap: 8px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 14px; font-weight: 700; color: var(--muted); }
    .field input, .field textarea, .field select {
      border: 1px solid var(--border); border-radius: 12px; background: #fff; padding: 12px 14px; font-size: 15px; outline: none;
      width: 100%; resize: vertical; color: var(--text); box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.02);
    }
    .field select {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 18px) calc(50% - 2px), calc(100% - 12px) calc(50% - 2px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 36px;
    }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: rgba(249,115,22,0.55); box-shadow: 0 0 0 4px rgba(249,115,22,0.08); }

    .error-box {
      display: none; padding: 10px 12px; border-radius: 10px; background: rgba(220,38,38,0.08); color: var(--danger); border: 1px solid rgba(220,38,38,0.12);
      font-size: 14px; margin-top: 12px; font-weight: 700;
    }
    .error-box.show { display: block; }

    .toast {
      position: fixed; right: 24px; bottom: 24px; background: rgba(17,24,39,0.95); color: white; border-radius: 12px; padding: 12px 16px; font-size: 14px; display: none;
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.22);
    }
    .toast.show { display: block; }

    .cart-fab {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 30;
      width: 66px;
      height: 66px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
      color: white;
      box-shadow: 0 18px 30px rgba(249,115,22,0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .cart-fab-count {
      position: absolute;
      top: -6px;
      right: -4px;
      min-width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      padding: 0 6px;
    }
    .floating-cart-panel {
      position: fixed;
      right: 18px;
      bottom: 98px;
      width: min(360px, calc(100vw - 30px));
      background: rgba(255,255,255,0.98);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 24px 40px rgba(15, 23, 42, 0.14);
      display: none;
      padding: 16px;
      z-index: 25;
    }
    .floating-cart-panel.open { display: block; }
    .floating-cart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .floating-cart-header h3 {
      margin: 0;
      font-size: 20px;
    }
    .floating-close-btn {
      border: none;
      background: transparent;
      font-size: 20px;
      cursor: pointer;
      color: var(--muted);
    }
    .floating-cart-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .floating-cart-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      background: #fffaf7;
      border: 1px solid rgba(249,115,22,0.12);
      border-radius: 10px;
      padding: 9px 10px;
      align-items: center;
    }
    .floating-cart-copy {
      flex: 1;
      min-width: 0;
    }
    .floating-cart-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .floating-cart-controls .qty-buttons {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: white;
    }
    .floating-cart-controls .qty-buttons button {
      border: none;
      background: transparent;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 18px;
      color: var(--text);
    }
    .floating-cart-controls .qty-buttons span {
      min-width: 24px;
      text-align: center;
      font-weight: 700;
    }
    .floating-cart-footer {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .floating-cart-footer .total-label {
      font-size: 14px;
      color: var(--muted);
    }
    .floating-cart-footer .total-value {
      font-size: 20px;
      font-weight: 900;
      color: var(--primary-dark);
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }

    @media (min-width: 901px) {
      .cart-fab,
      .floating-cart-panel {
        display: none !important;
      }
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .page-shell { padding: 18px; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="../assets/ssLogo.png" alt="Shri Senthura Crackers logo" />
        <div>
          <h1>Shri Senthura Crackers</h1>
          <p>Client Order & Delivery Booking</p>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="panel">
        <div class="toolbar">
          <div class="search-wrap">
            <span class="search-icon">🔎</span>
            <input id="searchInput" type="text" placeholder="Search products..." />
          </div>
          <div class="select-wrap">
            <select id="categoryFilter">
              <option value="">All Categories</option>
            </select>
          </div>
        </div>

        <div id="productGrid" class="product-grid"></div>
      </section>

      <aside class="panel cart-card">
        <div class="cart-header">
          <h2>Your Cart</h2>
          <span id="itemCount" class="item-count">0 items</span>
        </div>

          <div class="cart-actions">
          <button id="proceedBtn" class="action-btn" type="button">Proceed to Details</button>
        </div>

        <div id="cartWarning" class="cart-warning"></div>
        <div id="cartEmpty" class="empty-cart">Your cart is empty. Add products to continue.</div>
        <div id="cartList" class="cart-list" style="display: none;"></div>

        <div class="totals">
          <div class="total-row"><span>Subtotal</span><strong id="subtotal">₹0.00</strong></div>
          <div class="total-row"><span>Delivery / Handling</span><strong id="deliveryFee">₹0.00</strong></div>
          <div class="total-row grand-total"><span>Total</span><strong id="grandTotal">₹0.00</strong></div>
        </div>
      </aside>
    </main>

    <section id="detailsPanel" class="panel details-panel">
      <h2 style="margin: 0; font-size: 26px;">Your Details</h2>
      <div id="orderError" class="error-box"></div>

      <div class="form-grid">
        <div class="field full">
          <label for="customerName">Customer Name</label>
          <input id="customerName" type="text" placeholder="Enter your name" />
        </div>

        <div class="field full">
          <label for="customerPhone">Contact Number</label>
          <input id="customerPhone" type="tel" placeholder="e.g., +919876543210" />
        </div>

        <div class="field full">
          <label for="customerAddress">Address</label>
          <textarea id="customerAddress" rows="4" placeholder="Enter your full address"></textarea>
        </div>

        <div class="field">
          <label for="customerState">State</label>
          <select id="customerState">
            <option value="Tamil Nadu" selected>Tamil Nadu</option>
            <option value="Kerala">Kerala</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Andhra Pradesh">Andhra Pradesh</option>
            <option value="Telangana">Telangana</option>
            <option value="Puducherry">Puducherry</option>
            <option value="Other">Other</option>
          </select>
          <div id="stateWarning" class="state-warning"></div>
        </div>

        <div class="field">
          <label for="customerDistrict">District</label>
          <select id="customerDistrict">
            <option value="">Select District</option>
          </select>
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; margin-top: 18px;">
        <button id="confirmOrderBtn" class="action-btn" type="button">Generate Invoice &amp; Open WhatsApp</button>
      </div>
    </section>
  </div>

  <button id="cartFab" class="cart-fab" type="button" aria-label="Open cart">
    🛒
    <span id="cartFabCount" class="cart-fab-count">0</span>
  </button>

  <div id="floatingCartPanel" class="floating-cart-panel" aria-live="polite">
    <div class="floating-cart-header">
      <h3>Your Cart</h3>
      <button id="closeCartPanel" class="floating-close-btn" type="button" aria-label="Close cart">×</button>
    </div>
    <div id="floatingCartItems" class="floating-cart-items"></div>
    <div class="floating-cart-footer">
      <div>
        <div class="total-label">Total</div>
        <div id="floatingCartTotal" class="total-value">₹0.00</div>
      </div>
      <button id="floatingProceedBtn" class="action-btn" type="button">Proceed</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>
</body>
</html>
